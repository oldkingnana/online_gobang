<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络五子棋对战平台</title>
    <style>
        /* 简单的全局样式，让页面看起来更现代化 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 40px;
        }
        /* <a> 标签按钮化样式 */
        .btn {
            display: inline-block;
            margin: 0 15px;
            padding: 12px 30px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-login {
            background-color: #007bff; /* 蓝色登录按钮 */
        }
        .btn-register {
            background-color: #28a745; /* 绿色注册按钮 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>欢迎来到网络五子棋大厅</h1>
        
        <div>
            <a href="http://120.79.179.55:7777/login.html" class="btn btn-login">进入登录</a>
            <a href="http://120.79.179.55:7777/register.html" class="btn btn-register">注册账号</a>
        </div>
    </div>

</body>
</html>
